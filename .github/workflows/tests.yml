name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install pyyaml
      - name: Bootstrap example repo (tests expect a git repo)
        run: |
          git -C fabrika/loop/ornek-repo init -q
          git -C fabrika/loop/ornek-repo add -A
          git -C fabrika/loop/ornek-repo -c user.name=ci -c user.email=ci@local commit -qm "ornek-repo initial state"
      - name: Unit tests (no model calls)
        working-directory: fabrika/loop
        run: |
          set -e
          for t in tests/test_runner.py tests/test_capacity.py tests/test_seedtest.py \
                   tests/test_kovan_cli.py tests/test_adapter_http.py tests/test_verify.py \
                   tests/test_eval_run.py tests/test_reviewer.py tests/test_shift.py \
                   tests/test_durum.py tests/test_compliance.py tests/test_sbom.py \
                   tests/test_skill.py tests/skills/test_tests_kapisi.py \
                   tests/test_drill.py tests/test_retro.py tests/test_mutation.py \
                   tests/test_queue_build.py tests/test_console.py \
                   tests/test_simulation.py; do
            echo "== $t"
            python "$t"
          done
      - name: Weekly retro generator (smoke)
        working-directory: fabrika/loop
        run: python retro.py --runs runs --out reports --json > /dev/null
      - name: Log integrity scan
        working-directory: fabrika/loop
        run: python retro.py --log-saglik --runs runs
      - name: S1 runbook drill
        working-directory: fabrika/loop
        run: python drill.py
