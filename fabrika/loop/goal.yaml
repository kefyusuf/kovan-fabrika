# KOVAN — Machine-Readable Goal Contract
#
# This file is not a "prompt"; it is a contract. The loop runner
# (loop/runner.py) and the night shift read this file; the human reads the
# same file. What the two understand must be the same — otherwise "the agent
# drifted from the goal" is meaningless, because the goal was never written.
#
# Rule: no sentence in this file is unmeasurable. We do not write "better
# code"; we write "the rate of PRs merged without human correction".

goal:
  id: kovan-night-shift-v1
  name: Night Shift
  owner: human/founder
  horizon: 12 weeks
  statement: >
    To run a production loop that works between 23:00 and 06:00 every night,
    while the human sleeps, and by morning (a) produces verified knowledge,
    (b) distills that knowledge into reusable skills, and (c) leaves at most
    3 change proposals about its own structure.
  definition_of_done:
    - id: D1
      text: The morning report is ready by 06:00 and readable on a single page.
      measure: the file reports/sabah-YYYY-MM-DD.md exists and its 5 sections are filled
    - id: D2
      text: At least 2 sourced skill candidates were produced overnight.
      measure: at least 2 records with status=proposed inside skills.proposed.jsonl
    - id: D3
      text: No produced change touched the constitution files.
      measure: no record passing through anayasa/ in ledger.jsonl other than policy=blocked
    - id: D4
      text: The night cost did not exceed the ceiling.
      measure: state.json budget_left >= 0
    - id: D5
      text: If the same error class recurred on two nights, a skill candidate was opened.
      measure: lessons.jsonl fingerprint recurrence -> skills.proposed.jsonl

  anti_goals:
    - "Automatically merging product code at midnight (C2 is closed at night)."
    - "Amending the constitution by itself (C3 is human-only)."
    - "Improving the measurement: loosening the eval set, the threshold, or the test."
    - "Silently switching to a new external service or model."
    - "Presenting an unverified claim as verified in the morning report."

# ---------------------------------------------------------------------------
constraints:
  forbidden_paths:
    - anayasa/
    - politika/
    - .secrets/
    - .github/workflows/
    - loop/goal.yaml
    - loop/constitution.md
    - loop/gates.yaml
    - loop/agents.yaml
  max_attempts: 2
  allowed_hosts:
    - arxiv.org
    - export.arxiv.org
    - github.com
    - raw.githubusercontent.com
    - docs.anthropic.com
    - platform.openai.com
    - modelcontextprotocol.io
  require_human_for:
    - constitutional_change
    - model_change
    - network_policy_change
    - secret_access
    - production_deploy
    - license_change
  sandbox:
    kind: container
    network: allowlist
    filesystem: worktree_only
    secrets: none

# ---------------------------------------------------------------------------
budget:
  tokens_per_shift: 2_400_000
  wall_clock_minutes: 420
  max_usd_per_merged_pr: 6.00
  max_usd_per_shift: 40.00
  max_parallel_workers: 3

stop_rules:
  consecutive_failures: 3
  plateau_rounds: 5
  max_hours: 7
  kill_switch_file: STOP
  on_budget_exhausted: report_and_stop
  on_policy_violation: block_and_page_human

# ---------------------------------------------------------------------------
report:
  path: reports/sabah-{date}.md
  deadline: "06:00"
  must_include:
    - "What was learned (sourced, at most 5 items)"
    - "What was produced (file + status)"
    - "What was rejected and why"
    - "Today's top 3 tasks (those awaiting a human decision first)"
    - "Honesty note: what could not be verified"
  must_not_include:
    - "An unmeasured success percentage"
    - "A claim without a source"
