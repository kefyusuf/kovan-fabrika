# KOVAN — gece tarama kuyruğu
#
# tur: dosya → yerel markdown (repo kökü içinde, izolasyon sınırı)
# tur: url   → dış kaynak; KURU modda atlanır, canlı model gerekir
#
# Not: URL'ler yalnızca goal.yaml'daki izinli hostlardan olabilir
# (kısıt: allowed_hosts). Kuru mod bunlara dokunmaz, rapor işaretler.
#
# Kaynaklar repo içinden seçilir ki taze klon üzerinde de koşsun;
# araştırma sentezleri ARASTIRMA.md özetinde taşınır.

kaynaklar:
  - tur: dosya
    yol: fabrika/README.md
    konu: İ1–İ6 ilkeler ve dosya haritası
  - tur: dosya
    yol: fabrika/SISTEM.md
    konu: v2 sistem tanımı (3 hat, bileşenler)
  - tur: dosya
    yol: fabrika/ADR.md
    konu: Mimari kararlar (F01–F13)
  - tur: dosya
    yol: fabrika/PRD.md
    konu: Kabul kriterleri
  - tur: dosya
    yol: fabrika/QUALITY.md
    konu: Kalite normları ve ölçümler
  - tur: dosya
    yol: fabrika/EVIDENCE-UPDATE.md
    konu: Kanıt dersleri (§1–§18)
  - tur: url
    url: https://metr.org/blog/2026-02-24-uplift-update
    konu: METR ölçüm güncellemesi
  - tur: url
    url: https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/
    konu: Benchmark emekliliği
