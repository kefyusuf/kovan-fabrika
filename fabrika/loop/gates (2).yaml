# KOVAN — Kalite Kapıları
#
# Kapı sırası tesadüf değil: en ucuz ve en deterministik kapı önce çalışır.
# Amaç, pahalı model çağrısını hak etmeyen adayı 200 ms'de elemek.
#
# Üç kural:
# 1. `blocking: true` olan bir kapı geçilmeden sonraki kapı çalışmaz (fail-fast).
# 2. Sinyal yoksa kapı GEÇMEZ. "Ölçülmedi" ile "geçti" aynı şey değil.
# 3. Hiçbir kapı tek başına yeterli değil; LLM yargıcı asla tek kapı olamaz.

gates:
  - name: policy
    order: 10
    blocking: true
    kind: deterministic
    owner: airlock
    description: >
      Yasak yol, ağ hedefi veya izin ihlali var mı. Araç çağrısı düzeyinde
      Airlock, değişiklik düzeyinde bu kapı bakılır.
    on_fail: block_and_page_human

  - name: lint
    order: 20
    blocking: true
    kind: deterministic
    owner: kalite/statik
    description: Biçim ve stil. Tartışmaya kapalı, otomatik düzeltilebilir.
    on_fail: revise

  - name: types
    order: 30
    blocking: true
    kind: deterministic
    owner: kalite/statik
    description: Tip denetimi. Tip hatası varsa niyet belirsizdir.
    on_fail: revise

  - name: tests
    order: 40
    blocking: true
    kind: deterministic
    owner: kalite/test
    description: >
      Birim + entegrasyon. Adayın eklediği test, adayın kendi kodunu
      doğrulamak zorunda; testi silmek veya zayıflatmak kapıyı geçirmez.
    on_fail: revise

  - name: provenance
    order: 45
    blocking: true
    kind: deterministic
    owner: hukuk/uyum
    description: >
      Yeni bağımlılık, kopyalanmış kod veya lisans uyumsuzluğu. Üretilen
      kodun nereden geldiği kayıtlı olmalı (kaynak dosya + commit).
    on_fail: block_and_page_human

  - name: review
    order: 50
    blocking: true
    kind: agent
    owner: kalite/incelemeci
    description: >
      Bağımsız incelemeci; kodu yazan ajandan farklı bir oturumda çalışır.
      Onay gerekçesi yazılı olmak zorunda ("LGTM" geçersiz).
    on_fail: revise

  - name: eval
    order: 60
    blocking: true
    kind: statistical
    owner: arge/olcum
    signal: eval
    threshold: 0.90
    description: >
      Görev sınıfına ait regresyon setinde geçme oranı. Eşik, mevcut
      baseline'ın altına düşemez; düşerse otomatik geri alma.
    on_fail: reject_and_rollback

  - name: cost
    order: 70
    blocking: false
    kind: accounting
    owner: finans/butce
    signal: cost_usd
    threshold: 6.00
    description: >
      Birleşen PR başına maliyet. Bloklamaz, uyarır: tavan aşılırsa
      ertesi vardiyada model yönlendirmesi düşürülür.
    on_fail: warn_and_throttle

# Kapıların ürettiği kanıt nereye gider
evidence:
  ledger: loop/ledger.jsonl
  lessons: loop/lessons.jsonl
  skills: loop/skills.proposed.jsonl
  night_report: reports/sabah-{date}.md

# Eşik değişikliği kuralı (C3): eşiği düşürmek yasak, yükseltmek insan onayı.
threshold_policy:
  lowering: forbidden
  raising: human_required
  adding_new_gate: human_required
  removing_gate: human_required
