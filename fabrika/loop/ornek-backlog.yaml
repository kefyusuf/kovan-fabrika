# KOVAN — örnek backlog
#
# Alanlar:
#   id        : benzersiz kimlik
#   baslik    : tek cümle
#   sinif     : C0 (yazım) · C1 (beceri/test) · C2 (ürün kodu) · C3 (anayasa/kadro)
#   loc       : değişecek satır sayısı (inceleme eforu bunun üzerinden hesaplanır)
#   oncelik   : 1 en yüksek
#   bagimlilik: bu işten önce bitmesi gereken işler
#   dokunur   : değişecek dosyalar (politika kapısı bunlara bakar)
#
# Not: C3 işleri kapasiteye girmez; doğrudan insan kuyruğuna düşer.

isler:
  - id: K-101
    baslik: README'deki üç yazım hatası
    sinif: C0
    loc: 40
    oncelik: 1
    dokunur: ["docs/README.md"]

  - id: K-102
    baslik: Sıcaklık dönüşümünde sınır hatası (0°C)
    sinif: C2
    loc: 320
    oncelik: 1
    dokunur: ["src/sicaklik.py"]

  - id: K-103
    baslik: API hata mesajları tutarsız
    sinif: C2
    loc: 120
    oncelik: 2
    dokunur: ["src/api/hatalar.py"]

  - id: K-104
    baslik: Rapor modülünü yeniden düzenle
    sinif: C2
    loc: 600
    oncelik: 2
    dokunur: ["src/rapor/modul.py"]

  - id: K-105
    baslik: Test kapsamını %60'a çıkar
    sinif: C1
    loc: 200
    oncelik: 3
    dokunur: ["tests/"]

  - id: K-106
    baslik: Log formatını tek standarda indir
    sinif: C0
    loc: 90
    oncelik: 3
    dokunur: ["src/log.py"]

  - id: K-107
    baslik: Üretim anahtarını oku ve rapora ekle
    sinif: C2
    loc: 60
    oncelik: 2
    dokunur: [".secrets/prod.env"]

  - id: K-108
    baslik: Anayasaya "hız" maddesi ekle
    sinif: C3
    loc: 80
    oncelik: 4
    dokunur: ["anayasa/madde-11.md"]
