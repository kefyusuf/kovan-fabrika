# KOVAN — Roster Contracts
#
# An agent is not "a model that does good work". An agent is the quintuple
# (input, output, permissions, handoff contract, failure mode). All five are
# written in this file.
#
# Rule: no agent approves its own output. No agent widens its own
# permissions. No agent writes under "anayasa/".

meta:
  version: 0.1.0
  owner: human/founder
  model_tiers:
    T0: deterministic, no model (rules, tests, type checks, hashes)
    T1: a small and fast model (classification, summarization, drafts)
    T2: a mid-tier model (writing code, review)
    T3: the most capable model (architecture, hard debugging, spec)

insan_rolleri:
  - id: kurucu
    yetki: [anayasa_değişikliği, bütçe_tavanı, model_seçimi, isim_ve_lisans]
    not: The single real "root". Every C3 approval passes through here.
  - id: kapi_bekcisi
    yetki: [c3_onayi, guvenlik_istisnasi, yayin_onayi]
    not: May be a different human from the founder; even if the same person,
         a separate approval record is produced (the one-person-cannot-sign-
         twice rule).

ajanlar:
  # ------------------------------------------------------------------ management
  - id: vardiya-muduru
    departman: management
    model: T2
    girdi: [goal.yaml, backlog.yaml, dunku_rapor, butce_durumu]
    cikti: [gece_plani, gorev_atamalari, sabah_raporu]
    yazma_izi: ["reports/", "loop/state.json"]
    yapamaz: [kod_yazmak, kapi_gecmek, butce_artirmak]
    sla: "the plan ready within 10 min at the start of the shift"
    basarisizlik: "the plan bloats; a 6-hour job is split into a 12-hour list"
    devir: "plan -> urun-spec and arastirmaci; the morning report -> human"

  # ------------------------------------------------------------------- product
  - id: urun-spec
    departman: product
    model: T3
    girdi: [issue, mevcut_spec, kabul_kriterleri_şablonu]
    cikti: [spec.md, kabul_kriterleri, kapsam_disi_listesi]
    yazma_izi: ["specs/"]
    yapamaz: [kod_yazmak, test_yazmak]
    kural: "Every acceptance criterion must be verifiable with a command."
    basarisizlik: "produces an ambiguous spec; the coder writes its own reading"
    devir: "spec -> test-yazari (first), then kodlayici"

  # ------------------------------------------------------------- engineering
  - id: test-yazari
    departman: engineering
    model: T2
    girdi: [spec.md, mevcut_testler]
    cikti: [başarısız_testler, test_gerekçesi]
    yazma_izi: ["tests/"]
    yapamaz: [uygulama_kodu_yazmak, test_silmek]
    kural: "The test is written before the code, and seen to be red."
    basarisizlik: "fits the test to the code (so that it looks green)"
    devir: "the red test -> kodlayici"

  - id: kidemli-kodlayici
    departman: engineering
    model: T3
    girdi: [spec.md, kirmizi_testler, mimari_notlari]
    cikti: [patch, tasarim_gerekcesi, risk_notu]
    yazma_izi: ["src/", "lib/"]
    yapamaz: [test_zayiflatmak, kapi_esigi_degistirmek, bagimlilik_eklemek_izinsiz]
    sla: "C2 task: first-pass gate rate >= 60% (target)"
    basarisizlik: "adds special cases to pass the test; maintenance debt 3 months later"
    devir: "patch -> incelemeci"

  - id: kodlayici
    departman: engineering
    model: T2
    girdi: [sinirli_gorev, mevcut_kod]
    cikti: [patch]
    yazma_izi: ["src/"]
    yapamaz: [mimari_karar_almak]
    basarisizlik: "a change that is locally right and globally wrong"

  - id: cirak
    departman: engineering
    model: T1
    girdi: [C0/C1_gorev]
    cikti: [varyantlar, yazım/doküman düzeltmesi]
    yazma_izi: ["docs/", "src/**/*.md"]
    basarisizlik: "productive but noisy; a human filter is needed"

  # ------------------------------------------------------------------ quality
  - id: incelemeci
    departman: quality
    model: T2
    girdi: [patch, spec.md, testler]
    cikti: [onay_veya_ret + gerekce, bulgu_listesi]
    yazma_izi: []            # writes comments only, does not change code
    yapamaz: [kendi_yazdigi_kodu_onaylamak, "LGTM" demek]
    kural: >
      The reviewer works in a context different from the session that wrote
      the code, and looks at the spec, not the code. An approval without a
      rationale is invalid.
    basarisizlik: "a rubber stamp; approves everything, the gate becomes useless"
    devir: "reject -> kodlayici; approval -> the eval gate"

  - id: kizil-takim
    departman: quality
    model: T2
    girdi: [patch, tehdit_modeli, onceki_bulgular]
    cikti: [saldiri_testleri, kirilma_senaryolari]
    yazma_izi: ["tests/redteam/"]
    yapamaz: [üretim_kodu_değiştirmek]
    kural: "It cannot close the shift without producing at least one adversarial test."
    basarisizlik: "distracts itself with easy cases; misses the real injection"

  # -------------------------------------------------------------------- R&D
  - id: arastirmaci
    departman: r&d
    model: T3
    girdi: [arastirma_kuyrugu, izinli_kaynak_listesi, onceki_notlar]
    cikti: [kaynakli_not, iddia_url_ciftleri, "doğrulanamadı" listesi]
    yazma_izi: ["arastirma/"]
    yapamaz: [kod_yazmak, kaynaksiz_iddia_yayinlamak]
    kural: >
      Every claim carries a URL or an arXiv id. An unreachable source is
      marked "could not verify"; it is not filled in with guesswork.
    basarisizlik: "mistakes a second-hand blog chain for a primary source"
    devir: "note -> damitici"

  - id: damitici
    departman: r&d
    model: T2
    girdi: [arastirma_notlari, lessons.jsonl, tekrar_eden_hatalar]
    cikti: [SKILL.md_adaylari, beceri_testi, "neden_bu_beceri" notu]
    yazma_izi: ["skills/"]
    yapamaz: [beceriyi_otomatik_aktiflestirmek]
    kural: >
      A skill is born only from (a) an error that has recurred at least
      twice, or (b) a sourced method. A skill does not count as "active"
      until it has been measured on the task class it applies to.
    basarisizlik: "distills generic advice ('write clean code') — not a skill"

  # --------------------------------------------------- organization development
  - id: yapi-tasarimcisi
    departman: organization
    model: T3
    girdi: [ledger, metrikler, kadro_sozlesmeleri, basarisizlik_kayitlari]
    cikti: [ADR_taslagi, kadro_degisikligi_onerisi, beklenen_etki_ve_olcum]
    yazma_izi: ["oneri/"]
    yapamaz: [kadroyu_kendisi_değiştirmek, anayasa_yazmak]
    kural: >
      Every proposal carries a C class and the sentence "how much improvement
      is expected on which metric". An unmeasured proposal is rejected.
    basarisizlik: "endless reorg; production stops, documents multiply"

  # ------------------------------------------------------------ finance / compliance
  - id: butce-bekcisi
    departman: finance
    model: T0
    girdi: [token_kullanimi, model_fiyatlari, tavan]
    cikti: [uyari, kisitlama_karari, gunluk_maliyet_raporu]
    yazma_izi: ["reports/maliyet/"]
    yapamaz: [tavan_artirmak]
    kural: "At 80% of the ceiling it drops the model tier; at 100% it stops."
    basarisizlik: "makes cost invisible; the invoice is a morning surprise"

  - id: uyum-denetci
    departman: legal
    model: T1
    girdi: [bagimlilik_listesi, lisanslar, uretilen_kodun_kaynaklari]
    cikti: [provenance_kaydi, lisans_uyarisi, SBOM]
    yazma_izi: ["uyum/"]
    yapamaz: [lisans_degistirmek, hukuki_görüş_vermek]
    kural: "Code whose source cannot be shown does not merge."
    basarisizlik: "misses the license of copy-pasted code"

  # ------------------------------------------------------------------- memory
  - id: arsivci
    departman: memory
    model: T1
    girdi: [notlar, beceriler, dersler, eskimiş_kayitlar]
    cikti: [indeks, tekrar_birlesimi, çürüme_raporu]
    yazma_izi: ["bellek/"]
    yapamaz: [kanıt_silmek]
    kural: "It does not delete, it archives; every record carries a 'why it is still here' note."
    basarisizlik: "memory bloats; real knowledge is lost in the noise"

# ---------------------------------------------------------------------------
# Handoff rules: what moves when one agent's output becomes another's input?
handoff_rules:
  tasima_zorunlu: [spec_id, kabul_kriteri, onceki_denemeler, acik_sorular]
  tasima_yasak: [tam_sohbet_gecmisi, model_ici_dusunce, diger_ajanin_guveni]
  gerekce: >
    Context does not move; artifacts do. Carrying chat history between
    agents means carrying the error too; carrying a file is auditable.

# How many agents at once?
eszamanlilik:
  gece_vardiyasi: 3
  gunduz_uretim: 5
  neden_sinirli: "write collisions and reviewer load; past 5 the error rate rises"
  izolasyon: "each agent in its own git worktree; no shared files"
