# KOVAN — sample backlog
#
# Fields:
#   id        : a unique identifier
#   baslik    : one sentence
#   sinif     : C0 (spelling) · C1 (skills/tests) · C2 (product code) · C3 (constitution/roster)
#   loc       : the number of lines to change (review effort is computed from this)
#   oncelik   : 1 is the highest
#   bagimlilik: tasks that must finish before this one
#   dokunur   : the files to change (the policy gate looks at these)
#
# Note: C3 tasks do not consume capacity; they fall straight to the human queue.

