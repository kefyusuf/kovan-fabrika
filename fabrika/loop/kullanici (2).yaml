# KOVAN kullanıcı yapılandırması
# Kullanım: python kovan.py --yapilandirma kullanici.yaml plan
# CLI bayrakları yapılandırmayı ezer: python kovan.py plan --saat 1.5
#
# Bu dosya C0'dır: serbestçe düzenlenir (anayasa/kapılar değildir).

saat: 3.0                # günlük odaklı inceleme saatin (sistemin tavanı)
backlog: ornek-backlog.yaml
hedef_repo: ornek-repo
test_komut: "python -m unittest discover -s tests -t ."

# Canlı model (boşsa kuru mod):
base_url: https://api.openai.com/v1
model: gpt-4o-mini
anahtar_dosya: ""        # içeriği API anahtarı olan dosya (repoya koyma!)
eval_set: ""             # ör: eval_set/sicaklik-v1.jsonl (hedef repo'ya özel)
inceleme_url: ""         # bağımsız incelemeci için FARKLI bir uç nokta
uyum_izinli: uyum-izinli.yaml
egress_log: ""           # ör: egress.jsonl

kanarya: 0               # N>0: yalnızca ilk N kabul edilen iş koşulur
