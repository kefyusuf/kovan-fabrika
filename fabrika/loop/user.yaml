# KOVAN user configuration
# Usage: python kovan.py --config user.yaml plan
# CLI flags override the configuration: python kovan.py plan --hours 1.5
#
# This file is C0: freely editable (it is not the constitution/gates).

hours: 3.0               # your daily focused review hours (the system's ceiling)
backlog: sample-backlog.yaml
target_repo: ornek-repo
test_command: "python -m unittest discover -s tests -t ."

# Live model (empty = dry mode):
base_url: https://api.openai.com/v1
model: gpt-4o-mini
key_file: ""             # a file whose content is the API key (do not commit it!)
eval_set: ""             # e.g. eval_set/sicaklik-v1.jsonl (specific to the target repo)
review_url: ""           # a DIFFERENT endpoint for the independent reviewer
compliance_allowlist: compliance-allowlist.yaml
egress_log: ""           # e.g. egress.jsonl

canary: 0                # N>0: only the first N accepted tasks run
