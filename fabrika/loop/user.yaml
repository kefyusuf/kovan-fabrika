# KOVAN user configuration
# Usage: python kovan.py --yapilandirma user.yaml plan
# CLI flags override the configuration: python kovan.py plan --saat 1.5
#
# This file is C0: freely editable (it is not the constitution/gates).

saat: 3.0                # your daily focused review hours (the system's ceiling)
backlog: sample-backlog.yaml
hedef_repo: ornek-repo
test_komut: "python -m unittest discover -s tests -t ."

# Live model (empty = dry mode):
base_url: https://api.openai.com/v1
model: gpt-4o-mini
anahtar_dosya: ""        # a file whose content is the API key (do not commit it!)
eval_set: ""             # e.g. eval_set/sicaklik-v1.jsonl (specific to the target repo)
inceleme_url: ""         # a DIFFERENT endpoint for the independent reviewer
uyum_izinli: compliance-allowlist.yaml
egress_log: ""           # e.g. egress.jsonl

kanarya: 0               # N>0: only the first N accepted tasks run
